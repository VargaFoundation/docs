name: Import the Choregos documentation

# The Choregos user documentation is written in its own repository (VargaFoundation/choregos, folder
# `docs/site/`). This workflow imports it, at the latest release tag or the tag given, into
# `docs/choregos/`, builds the site to prove it, and opens a pull request here. Nothing is merged
# on its own: a person merges, and the deploy workflow publishes.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Choregos tag to import (default: the latest release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-choregos-docs
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the documentation site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo VargaFoundation/choregos --json tagName --jq .tagName)"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v?[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "::error::not a tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch Choregos at the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git clone --quiet --depth 1 --branch "$TAG" https://github.com/VargaFoundation/choregos.git "$RUNNER_TEMP/choregos"

      - name: Test the import script
        run: node --test scripts/import-choregos-docs.test.mjs

      - name: Import docs/site
        id: import
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set +e
          node scripts/import-choregos-docs.mjs --source "$RUNNER_TEMP/choregos" --ref "$TAG" --dest docs/choregos
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::notice::$TAG has no docs/site: nothing to import"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Anything new?
        id: diff
        if: steps.import.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain -- docs/choregos)" ]; then
            echo "::notice::docs/choregos is already at this tag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          branch="import/choregos-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A docs/choregos
          git commit --quiet -m "docs(choregos): import the documentation of Choregos $TAG"
          git push --force --quiet origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::the pull request for $branch is updated"
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "docs(choregos): import the documentation of Choregos $TAG" \
            --body "Imported from \`docs/site/\` of VargaFoundation/choregos at \`$TAG\` by the *Import the Choregos documentation* workflow. Links to the repository's reference pages point to GitHub at \`$TAG\`. The site was built with these pages before this pull request was opened. Edit the pages in the Choregos repository, not here."
